      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`, fragmentShader: `uniform float uT,uP; varying vec2 vUv; void main(){ if(vUv.x>uP) discard; float s=sin(vUv.x*60.-uT*20.+vUv.y*12.)*.5+.5; vec3 c=mix(vec3(.2,.6,.9),vec3(.85,.97,1.),s*.7); float a=(.55+.35*s)*smoothstep(uP,uP-.08,vUv.x); gl_FragColor=vec4(c*1.4,a); }` })); WORLD.scene.add(tube);
    const fish = Z.koi[0].g.clone(); fish.scale.setScalar(6); WORLD.scene.add(fish);
    for (let k = 0; k <= 40; k++) { const e = k / 40; tube.material.uniforms.uP.value = e; tube.material.uniforms.uT.value = k * .05; const p = curve.getPoint(e), q = curve.getPoint(Math.min(1, e + .02)); fish.position.copy(p); fish.lookAt(q); FX.dust.emit({ pos: p, n: 2, size: [.2, .8], life: .7, color: [.8, .92, 1], alpha: .5, buoy: -2 }); await wait(.025); }
    FX.dust.emit({ pos: to, n: 60, radial: 6, size: [.3, 1.6], life: 1.2, color: [.8, .92, 1], alpha: .7, buoy: -3 }); SFX.splash(); SFX.boom(.6); hitEnemy(c.dmg, crit); WORLD.scene.remove(fish); for (let k = 0; k < 15; k++) { tube.material.opacity = 1; tube.scale.setScalar(1 - k / 15 * .3); await wait(.02); } WORLD.scene.remove(tube); },
  async gong(c, crit) { camShot(V(6.2, 2.4, 2.6), V(5.6, 1.3, -1.2), 1.4); strikeGong(); await wait(.45); const ring = new THREE.Mesh(new THREE.TorusGeometry(1, .08, 8, 64), new THREE.MeshBasicMaterial({ color: new THREE.Color(2.5, 2, .9), transparent: true, blending: THREE.AdditiveBlending, toneMapped: false })); WORLD.scene.add(ring);
    camShot(DOG_POS.clone().add(side().multiplyScalar(-6)).add(V(0, 3, 0)), DOG_POS.clone().lerp(EN_POS, .5).add(V(0, 1, 0)), 1.5);
    for (let k = 0; k <= 30; k++) { const e = k / 30; ring.position.lerpVectors(DOG_POS, EN_POS, e).add(V(0, 1.5, 0)); ring.lookAt(EN_POS.clone().add(V(0, 1.5, 0))); ring.scale.setScalar(1 + e * 2.5); ring.material.opacity = 1 - e * .5; await wait(.02); }
    WORLD.scene.remove(ring); hitEnemy(c.dmg, crit); B.enemy.stun = 1; popNum(enHead().add(V(0, .6, 0)), 'STUNNED', 'heal'); },
  async laser(c, crit) { const eye = [-.09, .09].map(x => Z.g.localToWorld(V(x, .47, .3))); camShot(DOG_POS.clone().add(V(0, 1.4, 0)).add(side().multiplyScalar(2.5)).add(EN_POS.clone().sub(DOG_POS).normalize().multiplyScalar(-2.5)), EN_POS.clone().add(V(0, 1.5, 0)), 2); say('such laser.'); SFX.ping(); SFX.whoosh(1.2);
    const beams = eye.map(() => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, 1, 8, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.2, .7), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); WORLD.scene.add(m); return m; });
    for (let k = 0; k < 40; k++) { const tgt = enHead().add(V(Math.sin(k * .3) * .5, Math.cos(k * .25) * .4 - .4, 0)); beams.forEach((m, i) => { const e = Z.g.localToWorld(V(i ? .09 : -.09, .47, .3)), d = tgt.clone().sub(e); m.position.copy(e).addScaledVector(d, .5); m.scale.set(1 + Math.random() * .5, d.length(), 1 + Math.random() * .5); m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); });
      if (k % 3 === 0) FX.sparks.emit(tgt, 16, { speed: 7, life: .5 }); if (k % 10 === 9) hitEnemy(c.dmg / 4, crit && k === 39); await wait(.025); } beams.forEach(m => WORLD.scene.remove(m)); },
  async heal(c) { camShot(DOG_POS.clone().add(side().multiplyScalar(-3)).add(V(0, 2, 3)), dogHead(), 1.6); SFX.chime(); say('much heal.'); Z.lev = Math.max(Z.lev, .4);
    for (let k = 0; k < 30; k++) { FX.glow.emit({ pos: Z.g.position.clone().add(V(Math.cos(k * .7) * 1.4, k * .08, Math.sin(k * .7) * 1.4)), n: 2, vel: { x: 0, y: 2, z: 0 }, size: [.15, .03], life: 1.2, color: [.5, 1, .5] }); await wait(.03); }
    B.php = Math.min(B.pmax, B.php + c.heal); popNum(dogHead(), '+' + c.heal, 'heal'); updateBars(); },
  async shield(c) { B.shield = 1; SFX.chime(); B.shieldMesh.visible = true; B.shieldMesh.scale.setScalar(.01); for (let k = 0; k <= 15; k++) { B.shieldMesh.scale.setScalar(easeOut(k / 15)); await wait(.02); } popNum(dogHead(), 'SHIELD', 'heal'); say('ensō.'); },
  async meteor(c, crit) { const to = EN_POS.clone(), from = to.clone().add(V(-14, 30, -10)); camShot(DOG_POS.clone().add(V(0, 4, 0)).add(side().multiplyScalar(-8)), to.clone().add(V(0, 4, 0)), 2.6); say('very meteor.'); SFX.whoosh(1.8);
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1, 1), new THREE.MeshStandardMaterial({ color: 0x3a2a22, roughness: 1, emissive: new THREE.Color(.8, .25, .05) })); WORLD.scene.add(rock);
    for (let k = 0; k <= 50; k++) { const e = k / 50; rock.position.lerpVectors(from, to, e * e); rock.rotation.x += .2; rock.rotation.z += .13; FX.fire.emit({ pos: rock.position, n: 4, spread: [.6, .6, .6], size: [1, 3], life: .6, kind: 1, color: [1.3, 1, 1], alpha: .85 }); FX.smoke.emit({ pos: rock.position, n: 2, size: [1, 3.5], life: 2, color: [.25, .2, .2], alpha: .5 }); await wait(.022); }
    WORLD.scene.remove(rock); impact({ x: to.x, y: .5, z: to.z }, { k: 1.8, floor: 0, rocks: true }); FX.flash = .35; SFX.boom(1.8); hitEnemy(c.dmg, crit); rakeRing(to.x, to.z, 1, 8); await wait(.4); } };

/* ───────── enemy turn ───────── */
async function endTurn() { if (B.state !== 'player' && B.state !== 'anim') return; B.state = 'enemy'; renderHand(); $('#hand').classList.add('down'); const E = B.enemy; await wait(.5);
  if (E.stun) { E.stun = 0; popNum(enHead(), 'zzz…', ''); await wait(1); } else { const [name, kind, lo, hi] = E.intent, d = Math.round(rnd(lo, hi)); toast(name); E.k = 1;
    camShot(EN_POS.clone().add(side().multiplyScalar(5)).add(V(0, 2.5, 0)).add(EN_POS.clone().sub(DOG_POS).normalize().multiplyScalar(3)), DOG_POS.clone().add(V(0, 1, 0)), 2.2);
    if (kind === 'lunge') { const s = E.g.position.clone(), t = DOG_POS.clone().lerp(EN_POS, .3); for (let k = 0; k <= 16; k++) { E.g.position.lerpVectors(s, t, easeInOut(k / 16)); await wait(.02); } impact({ x: DOG_POS.x, y: 1, z: DOG_POS.z }, { k: .9, floor: 0, fire: false }); hitPlayer(d); await wait(.3); for (let k = 0; k <= 16; k++) { E.g.position.lerpVectors(t, s, k / 16); await wait(.02); } }
    if (kind === 'shot' || kind === 'rain') { const n = kind === 'rain' ? 8 : 3; for (let k = 0; k < n; k++) { B.shots.push({ t: 0, from: kind === 'rain' ? DOG_POS.clone().add(V(rnd(-2, 2), 12, rnd(-2, 2))) : enHead(), to: dogHead().add(V(rnd(-.4, .4), rnd(-.3, .3), 0)), col: kind === 'rain' ? [1, .25, .2] : (E.def.id === 'serpent' ? [.7, .3, 1] : [1, .45, .2]), kind: 'orb', dur: kind === 'rain' ? .5 : .6 }); await wait(.16); } await wait(.6); hitPlayer(d); }
    if (kind === 'rug') { say('the ground…'); for (let k = 0; k < 24; k++) { Z.g.position.x = DOG_POS.x + Math.sin(k * 1.3) * .25 * (1 - k / 24); FX.dust.emit({ pos: V(DOG_POS.x + rnd(-2, 2), .1, DOG_POS.z + rnd(-2, 2)), n: 3, size: [.4, 1.6], life: 1, color: [.7, .2, .3], alpha: .5 }); await wait(.03); } Z.g.position.copy(DOG_POS); hitPlayer(d); }
    if (kind === 'beam') { const m = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, 1, 10, 1, true), new THREE.MeshBasicMaterial({ color: new THREE.Color(3, .3, .2), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); WORLD.scene.add(m);
      for (let k = 0; k < 30; k++) { const a = E.g.userData.flame.getWorldPosition(V(0, 0, 0)), b = dogHead(), dd = b.clone().sub(a); m.position.copy(a).addScaledVector(dd, .5); m.scale.set(1 + Math.random() * .4, dd.length(), 1); m.quaternion.setFromUnitVectors(V(0, 1, 0), dd.normalize()); if (k % 3 === 0) FX.sparks.emit(b, 14, { speed: 6 }); await wait(.03); } WORLD.scene.remove(m); hitPlayer(d); } }
  await wait(.6); $('#hand').classList.remove('down'); if (B.php <= 0) return lose(); newTurn(); }

/* ───────── win / lose ───────── */
async function defeatEnemy() { B.state = 'anim'; const E = B.enemy; camShot(EN_POS.clone().add(V(4, 3, 6)), EN_POS.clone().add(V(0, 1.5, 0)), 2.5); SFX.boom(1.6); FX.flash = .6; slam('DEFEATED', E.def.name);
  for (let k = 0; k < 6; k++) { impact({ x: EN_POS.x + rnd(-1, 1), y: rnd(.5, 2.5), z: EN_POS.z + rnd(-1, 1) }, { k: .8, floor: 0, rocks: false }); await wait(.12); }
  for (let k = 0; k < 20; k++) { E.g.scale.setScalar(1 - k / 20); E.g.rotation.y += .3; await wait(.03); } WORLD.scene.remove(E.g); Z.storm = 1; FX.glow.emit({ pos: EN_POS.clone().add(V(0, 1.5, 0)), n: 120, radial: 6, size: [.2, .04], life: 2, color: [1, .8, .5] }); say(pick(['such win.', 'very defeat. for them.', 'wow.']));
  await wait(2.4); if (B.stage + 1 < BOSSES.length) { B.emax = Math.min(5, B.emax + (B.stage % 2 === 0 ? 1 : 0)); startStage(B.stage + 1); } else champion(); }
async function champion() { B.state = 'win'; $('#hand').innerHTML = ''; $('#bars').classList.add('hidden'); Z.lev = 1; Z.storm = 1; SFX.gong(); setTimeout(() => SFX.shimmer(), 600); slam('ENLIGHTENED CHAMPION', 'all four bosses defeated');
  camShot(DOG_POS.clone().add(V(0, 3, 7)), dogHead(), 4); for (let k = 0; k < 14; k++) { const p = V(rnd(-8, 8), rnd(6, 11), rnd(-8, 2)); FX.glow.emit({ pos: p, n: 60, radial: 5, size: [.2, .04], life: 1.8, color: pick([[1, .8, .4], [1, .5, .7], [.6, .9, 1]]) }); SFX.boom(.3); await wait(.25); } $('#panel').classList.remove('hidden'); $('#again').classList.remove('hidden'); }
function lose() { B.state = 'lose'; slam('MUCH DEFEAT', 'such retry?'); $('#hand').innerHTML = ''; $('#again').classList.remove('hidden'); }
function restart() { $('#again').classList.add('hidden'); $('#panel').classList.add('hidden'); B.php = B.pmax = 100; B.emax = 3; B.shield = 0; B.turn = 0; startStage(0); }

/* ───────── per-frame ───────── */
function updateBattle(dt, t) { if (B.enemy) { const E = B.enemy; E.k = Math.max(0, E.k - dt * 2); E.flash = Math.max(0, E.flash - dt * 4); E.g.userData.idle(t, E.k); E.g.traverse(o => { if (o.isMesh && o.material.emissive && !o.material.userData.base) o.material.userData.base = o.material.emissive.clone(); if (o.isMesh && o.material.userData.base) o.material.emissive.copy(o.material.userData.base).add(new THREE.Color(E.flash * .35, E.flash * .1, E.flash * .05)); });
    if (E.stun && Math.random() < dt * 8) FX.glow.emit({ pos: enHead().add(V(Math.cos(t * 5) * .8, .6, Math.sin(t * 5) * .8)), n: 1, size: [.15, .05], life: .4, color: [1, 1, .4] }); }
  B.shots = B.shots.filter(s => { s.t += dt / (s.dur || .55); const e = clamp(s.t), p = s.from.clone().lerp(s.to, e); p.y += Math.sin(e * Math.PI) * (s.kind === 'petal' ? 2 : .6); if (s.kind === 'petal') { p.x += Math.sin(e * 9 + s.ph) * .6; p.z += Math.cos(e * 9 + s.ph) * .6; }
    FX.glow.emit({ pos: p, n: 2, spread: [.12, .12, .12], size: [s.kind === 'petal' ? .1 : .16, .02], life: .3, color: s.col }); if (s.kind === 'orb') FX.fire.emit({ pos: p, n: 1, size: [.3, .7], life: .25, kind: 0, color: s.col, alpha: .8 }); if (e >= 1) { FX.sparks.emit(s.to, 18, { speed: 6, life: .5 }); return false; } return true; });
  B.fx = B.fx.filter(f => { f.t += dt; const p = f.p.clone().add(V(0, f.t * 1.2, 0)).project(WORLD.camera); f.el.style.transform = `translate(${(p.x * .5 + .5) * innerWidth}px,${(-p.y * .5 + .5) * innerHeight}px) translate(-50%,-50%) scale(${1 + Math.max(0, .3 - f.t) * 2})`; f.el.style.opacity = Math.max(0, 1 - Math.max(0, f.t - .7) / .5); if (f.t > 1.3) { f.el.remove(); return false; } return true; });
  if (B.shieldMesh) { B.shieldMesh.position.copy(Z.g.position).add(EN_POS.clone().sub(DOG_POS).normalize().multiplyScalar(1.6)).add(V(0, 1.3, 0)); B.shieldMesh.lookAt(EN_POS.clone().add(V(0, 1.3, 0))); B.shieldMesh.rotation.z += 0; B.shieldMesh.material.opacity = .55 + Math.sin(t * 4) * .2; }
  Z.dmgFlash = Math.max(0, (Z.dmgFlash || 0) - dt * 3); }
function initBattle() { Z.g.position.copy(DOG_POS); Z.g.rotation.y = Math.atan2(EN_POS.x - DOG_POS.x, EN_POS.z - DOG_POS.z); rakeRing(DOG_POS.x, DOG_POS.z, 2, 4); rakeRing(EN_POS.x, EN_POS.z, 2.4, 4);
  B.shieldMesh = new THREE.Mesh(new THREE.TorusGeometry(1.3, .07, 8, 64, Math.PI * 1.85), new THREE.MeshBasicMaterial({ color: new THREE.Color(.6, 1.6, 3), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false })); B.shieldMesh.visible = false; WORLD.scene.add(B.shieldMesh);
  $('#endturn').onclick = () => { if (B.state === 'player') { SFX.tick(); endTurn(); } }; $('#again').onclick = () => restart(); }


</script>
